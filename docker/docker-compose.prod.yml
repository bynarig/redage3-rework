name: redage-prod

# Production stack. Run from repo root:
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Notes:
#  - RAGE:MP server itself runs on the host (loads packages/gateway/index.mjs)
#    and connects to this stack over the published 9092 port.
#  - kafka-ui is NOT included — bring it up separately if you need it.
#  - All credentials below are placeholders. In real prod, put them in docker/.env
#    and run compose with `--env-file docker/.env` from the repo root.

services:
  postgres:
    image: postgres:16-alpine
    container_name: redage-postgres-prod
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redage}
      POSTGRES_USER: ${POSTGRES_USER:-redage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../src/backend/database/main_rework.sql:/docker-entrypoint-initdb.d/01-main_rework.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redage} -d ${POSTGRES_DB:-redage}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  kafka:
    image: apache/kafka:3.8.0
    container_name: redage-kafka-prod
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-localhost}:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "redage-prod-cluster-0001"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # One-shot topic provisioner. Runs once when the stack comes up, creates the
  # topics our services subscribe to, then exits. Services depend on this so
  # they don't race against missing topics (auto-create is intentionally off).
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: redage-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKER=kafka:9094
        for entry in \
          "game.events.player:12" \
          "game.events.vehicle:12" \
          "game.events.inventory:12" \
          "game.events.economy:6" \
          "game.events.world:6" \
          "game.commands.auth:6" \
          "game.commands.player:12" \
          "game.commands.inventory:12" \
          "game.commands.economy:6" \
          "game.replies.gateway:6"; do
          topic="$${entry%%:*}"
          parts="$${entry##*:}"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BROKER" \
            --create --if-not-exists --topic "$$topic" \
            --partitions "$$parts" --replication-factor 1
        done

  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: "@redage/auth-service"
    image: redage/auth-service:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:9094
      DATABASE_URL: postgresql://${POSTGRES_USER:-redage}:${POSTGRES_PASSWORD:-redage}@postgres:5432/${POSTGRES_DB:-redage}?schema=public
      HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${AUTH_REPLICAS:-1}
      resources:
        limits:
          memory: 512M

  player-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: "@redage/player-service"
    image: redage/player-service:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:9094
      DATABASE_URL: postgresql://${POSTGRES_USER:-redage}:${POSTGRES_PASSWORD:-redage}@postgres:5432/${POSTGRES_DB:-redage}?schema=public
      HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${PLAYER_REPLICAS:-1}
      resources:
        limits:
          memory: 512M

  # The RAGE:MP server itself. Loads packages/gateway/index.mjs at boot, which
  # imports the built @redage/gateway and bridges mp.events <-> Kafka.
  # Game clients connect on UDP/TCP 22005; HTTP assets served on 22006.
  ragemp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ragemp
    image: redage/ragemp:latest
    container_name: redage-ragemp
    # ragemp-server has no arm64 build, so we pin amd64. On Apple Silicon hosts
    # Docker Desktop translates via Rosetta (enable in Settings -> General).
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      player-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:9094
      KAFKA_CLIENT_ID: redage-gateway
      GATEWAY_REPLY_TOPIC: game.replies.gateway
      GATEWAY_CONSUMER_GROUP: redage-gateway
    ports:
      - "${RAGEMP_PORT:-22005}:22005/udp"
      - "${RAGEMP_PORT:-22005}:22005/tcp"
      - "${RAGEMP_HTTP_PORT:-22006}:22006/tcp"
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  kafka-data:
  postgres-data:
