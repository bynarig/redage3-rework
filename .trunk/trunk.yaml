version: 0.1
cli:
  version: 1.22.8
plugins:
  sources:
    - id: trunk
      ref: v1.6.8
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - eslint@10.2.1
    - prettier@3.8.3
    - git-diff-check
    - actionlint@1.7.7
  ignore:
    - linters: [eslint, prettier]
      paths:
        # legacy workspaces kept for reference only
        - src_cef/**
        - src_client/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
